<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark green gradient for L (using grass colors) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#269900"/>
      <stop offset="100%" stop-color="#1A4D00"/>
    </linearGradient>
    
    <!-- Bright green gradient for B (using grass colors) -->
    <linearGradient id="lightGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40B226"/>
      <stop offset="100%" stop-color="#33A619"/>
    </linearGradient>
    
  </defs>
  
  <!-- Letter "L" made of blocks - green theme (maximized and perfectly centered) -->
  <g>
    <!-- Vertical part of L -->
    <rect x="96" y="151" width="100" height="100" rx="16" fill="url(#greenGrad)" stroke="#E6F2E6" stroke-width="3"/>
    <rect x="96" y="261" width="100" height="100" rx="16" fill="url(#greenGrad)" stroke="#E6F2E6" stroke-width="3"/>
    <rect x="96" y="371" width="100" height="100" rx="16" fill="url(#greenGrad)" stroke="#E6F2E6" stroke-width="3"/>
    <!-- Horizontal part of L -->
    <rect x="206" y="371" width="100" height="100" rx="16" fill="url(#greenGrad)" stroke="#E6F2E6" stroke-width="3"/>
  </g>
  
  <!-- Letter "B" made of blocks - light green theme (maximized and perfectly centered) -->
  <g>
    <!-- Vertical spine of B -->
    <rect x="206" y="261" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
    <rect x="206" y="151" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
    <rect x="206" y="41" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
    <!-- Top horizontal of B -->
    <rect x="316" y="41" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
    <!-- Middle horizontal of B -->
    <rect x="316" y="151" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
    <!-- Bottom horizontal of B -->
    <rect x="316" y="261" width="100" height="100" rx="16" fill="url(#lightGreenGrad)" stroke="#F0F8F0" stroke-width="3"/>
  </g>
</svg>