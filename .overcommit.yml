# Overcommit configuration for conventional commits
# See: https://github.com/sds/overcommit

# Verify all hook scripts are signed
verify_signatures: true

# Git hooks configuration
CommitMsg:
  ALL:
    requires_files: false
    quiet: false

  # Enforce conventional commit format
  MessageFormat:
    enabled: true
    pattern: '^(feat|fix|docs|style|refactor|perf|test|chore|revert|build|ci)(\(.+\))?: .{1,72}'
    expected_pattern_message: |
      Commit message must follow Conventional Commits format:
        <type>(<scope>): <description>

      Types:
        feat:     New feature (maps to Added in changelog)
        fix:      Bug fix (maps to Fixed in changelog)
        docs:     Documentation only
        style:    Code style/formatting
        refactor: Code refactoring (maps to Changed in changelog)
        perf:     Performance improvement (maps to Changed in changelog)
        test:     Adding/updating tests
        chore:    Maintenance tasks
        revert:   Reverting changes (maps to Removed in changelog)
        build:    Build system changes
        ci:       CI/CD changes

      Examples:
        feat: Add dark mode support
        fix(grid): Resolve block placement bug
        docs: Update README
        chore: Update dependencies
    sample_message: 'feat(game): Add new block shapes'

  # Ensure subject line isn't too long
  TextWidth:
    enabled: true
    max_subject_width: 72
    max_body_width: 80

  # Prevent empty commit messages
  EmptyMessage:
    enabled: true

# Pre-commit hooks (optional - can add SwiftLint later)
PreCommit:
  ALL:
    problem_on_unmodified_line: ignore

# Pre-push hooks
PrePush:
  ALL:
    requires_files: false
