name: Tooling

# The release pipeline and the CI logic itself had no test coverage: a Fastfile
# or helper script that no longer loads would merge green and surface later,
# mid-release. This job covers both, needs no App Store Connect credentials,
# and runs in about a minute.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/**'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.githooks/**'
      - '.xcode-version'
      - '.github/workflows/tooling.yml'
      # check-docs-versions.sh compares the docs against the project's
      # deployment target, so both sides of that comparison must trigger it.
      # #89 changed the project and left five documents contradicting it;
      # without these paths the guard would not have run on either commit.
      - '*.md'
      - 'conventions/**'
      - 'LeavesOfBlocks.xcodeproj/**'
      # check-locales.sh holds four registries to .locales, and two of them are
      # app-side: the string catalog and every "key".localized lookup in Swift.
      # Without these paths a PR could add a lookup with no catalog entry -- the
      # defect that shipped three raw keys into previews -- and merge green.
      - '.locales'
      - 'LeavesOfBlocks/**/*.swift'
      - 'LeavesOfBlocks/Resources/Localizable.xcstrings'

permissions:
  contents: read

jobs:
  tooling:
    name: Scripts and fastlane
    # macOS because the script suites exercise real Xcode discovery
    # (xcode-version.sh --check reads the installed xcodebuild).
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ahead of the suites deliberately. This also runs inside
      # test-check-locales.sh, but a registry disagreement is the failure most
      # likely to arrive here, and it reads better as its own red step than as
      # one assertion among dozens.
      - name: Verify locale registries agree
        run: ./scripts/check-locales.sh

      - name: Run script test suites
        run: ./scripts/run-script-tests.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # `lanes` loads the Fastfile, Appfile, Constants.rb and every require'd
      # helper, then enumerates the lanes. It does not run before_all and needs
      # no credentials -- but it does catch the failure this job exists for: a
      # config file that no longer parses or loads.
      - name: Verify fastlane configuration loads
        run: bundle exec fastlane lanes

      # `lanes` never loads the Deliverfile, so a bad path in it survives that
      # check and only surfaces mid-deploy. This loads it.
      - name: Verify Deliverfile paths resolve
        run: ./scripts/check-deliverfile-paths.sh
