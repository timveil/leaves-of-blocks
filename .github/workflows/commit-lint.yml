name: Commit Message Lint

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Format rules live in scripts/check-commit-subject.sh — both the local
# .githooks/commit-msg hook and this Action invoke that single script, so the
# regex / allowed types / width are defined exactly once. The iteration over a
# commit range lives in scripts/lint-commit-range.sh; see
# conventions/workflow-scripts.md for why neither is inline here.

jobs:
  lint:
    name: Validate commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate each commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/lint-commit-range.sh "$BASE_SHA" "$HEAD_SHA"
