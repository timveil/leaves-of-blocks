name: Commit Message Lint

on:
  pull_request:
    branches: [ "main" ]
    # `edited` matters: without it, a title fixed after the first failing run is
    # never re-checked, and the PR stays red until an unrelated push happens to
    # re-trigger the workflow.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Format rules live in scripts/check-commit-subject.sh — both the local
# .githooks/commit-msg hook and this Action invoke that single script, so the
# regex / allowed types / width are defined exactly once. The iteration over a
# commit range lives in scripts/lint-commit-range.sh; see
# conventions/workflow-scripts.md for why neither is inline here.
#
# Two things are checked, because they are two different strings. The commits
# in the PR get squashed away; what lands on main is the subject GitHub composes
# from the PR title (or the single commit's subject) plus " (#N)".

jobs:
  lint:
    name: Validate commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR titles are attacker-controlled -- anyone who can open a pull request
      # chooses this string. It is passed through the environment rather than
      # interpolated into the run block, so a title containing shell syntax is
      # data rather than code.
      - name: Validate the squash-merge subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/check-pr-title.sh "$PR_TITLE" "$PR_NUMBER"

      - name: Validate each commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/lint-commit-range.sh "$BASE_SHA" "$HEAD_SHA"
