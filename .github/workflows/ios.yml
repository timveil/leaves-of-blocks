name: iOS Build and Test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.plist'
      - '**.entitlements'
      - 'LeavesOfBlocks/**'
      - 'LeavesOfBlocksTests/**'
      - 'LeavesOfBlocksUITests/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.plist'
      - '**.entitlements'
      - 'LeavesOfBlocks/**'
      - 'LeavesOfBlocksTests/**'
      - 'LeavesOfBlocksUITests/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    name: Build and test using iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
      - name: Select Xcode
        run: |
          # Use Xcode 26.1 (latest stable version)
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version
      - name: Setup iOS Simulator
        run: |
          # List available runtimes and devices
          echo "Available runtimes:"
          xcrun simctl list runtimes
          echo "Available devices:"
          xcrun simctl list devices
          # Find the latest iOS runtime available (Xcode 26.1 includes iOS 26)
          RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | awk '{print $NF}')
          if [ -z "$RUNTIME" ]; then
            echo "No iOS runtime found, will try to proceed anyway"
          else
            echo "Using runtime: $RUNTIME"
            # Create iPhone 16 Pro simulator
            xcrun simctl create "iPhone 16 Pro CI" "iPhone 16 Pro" "$RUNTIME" || true
          fi
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build and Test
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          # Build using explicit iOS Simulator destination with available runtime
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=iPhone 16 Pro CI"
          # Then run tests if any exist
          xcodebuild test -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,name=iPhone 16 Pro CI" -skip-testing-configuration-validation || echo "Tests completed or no tests found"
