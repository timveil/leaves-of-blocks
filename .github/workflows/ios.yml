name: iOS Build and Test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.entitlements'
      - '**.xcstrings'
      - '**.xcprivacy'
      - '**.xctestplan'
      - '.github/workflows/ios.yml'
      - 'scripts/build.sh'
      - 'scripts/xcode-version.sh'
      - '.xcode-version'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.entitlements'
      - '**.xcstrings'
      - '**.xcprivacy'
      - '**.xctestplan'
      - '.github/workflows/ios.yml'
      - 'scripts/build.sh'
      - 'scripts/xcode-version.sh'
      - '.xcode-version'

permissions:
  contents: read

# A superseded run's answer is worthless, but it keeps a runner busy to
# completion -- and with four macOS jobs per pull request against a capped
# macOS concurrency, the next push queues behind runs nobody will read.
# Pushes to main are not cancelled: that run is the signal for main itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build for Testing
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Cache Derived Data
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ hashFiles('LeavesOfBlocks.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-

      - name: Show Environment
        run: ./scripts/build.sh info

      - name: Build for Testing
        run: ./scripts/build.sh build-for-testing

      - name: Upload Test Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: build/DerivedData/Build/Products
          retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Test Build
        uses: actions/download-artifact@v8
        with:
          name: test-build
          path: build/DerivedData/Build/Products

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Run Unit Tests
        run: ./scripts/build.sh test-unit-without-building

      - name: Render Test Summary
        if: always()
        run: python3 scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Test Results (xcresult + log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            build/results/test-unit-*.xcresult
            build/logs/test-unit-*.log
          retention-days: 14
          if-no-files-found: warn

  ui-tests:
    # The UI suite is the pull request's critical path: it runs serially,
    # because parallel simulator clones crash (see scripts/build.sh), so its
    # wall time is the sum of every test's. Splitting it over two runners buys
    # the parallelism from separate machines instead, which is the part that
    # was never unstable.
    #
    # Shard 1 runs "everything the other shard is not taking", so a test the
    # split does not know about still runs rather than silently running
    # nowhere. Raising the shard count needs only this list changed.
    name: UI Tests (${{ matrix.shard }}/2)
    runs-on: macos-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Test Build
        uses: actions/download-artifact@v8
        with:
          name: test-build
          path: build/DerivedData/Build/Products

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Run UI Tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: ./scripts/build.sh test-ui-without-building

      - name: Render Test Summary
        if: always()
        run: python3 scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Test Results (xcresult + log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            build/results/test-ui-*.xcresult
            build/logs/test-ui-*.log
          retention-days: 14
          if-no-files-found: warn
