name: iOS Build and Test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.entitlements'
      - '**.xcstrings'
      - '**.xcprivacy'
      - '**.xctestplan'
      - '.github/workflows/ios.yml'
      - 'scripts/build.sh'
      - 'scripts/xcode-version.sh'
      - '.xcode-version'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.swift'
      - '**.xcodeproj/**'
      - '**.xcworkspace/**'
      - '**.xcdatamodeld/**'
      - '**.xcassets/**'
      - '**.storyboard'
      - '**.xib'
      - '**.entitlements'
      - '**.xcstrings'
      - '**.xcprivacy'
      - '**.xctestplan'
      - '.github/workflows/ios.yml'
      - 'scripts/build.sh'
      - 'scripts/xcode-version.sh'
      - '.xcode-version'

permissions:
  contents: read

# A superseded run's answer is worthless, but it keeps a runner busy to
# completion -- and with four macOS jobs per pull request against a capped
# macOS concurrency, the next push queues behind runs nobody will read.
# Pushes to main are not cancelled: that run is the signal for main itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build for testing
    runs-on: macos-latest
    # Every job here is bounded. Run 34158232668 lost a runner after 48
    # minutes -- a UI shard that normally finishes in 8 stalled, and GitHub
    # reported "the hosted runner lost communication with the server", which
    # says nothing about what hung. A job that stops at its bound leaves a log
    # ending where the work stopped. The numbers are roughly triple the
    # observed durations, so they catch a hang without failing a slow runner.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      # Caches what the build actually writes. It used to name
      # ~/Library/Developer/Xcode/DerivedData while build.sh has always sent
      # build-for-testing to build/DerivedData, so the directory never existed
      # at save time and nothing was ever stored -- every run logged "Cache not
      # found" against both the exact key and the broad restore-key, and the
      # step was decorative.
      #
      # Worth watching now that it can hit: a DerivedData archive is large, and
      # restoring one can cost more than this build does cold (90s, measured).
      # If the restore does not pay for itself, delete the step rather than
      # keep an optimization that only looks like one.
      - name: Cache derived data
        uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: derived-data-${{ hashFiles('LeavesOfBlocks.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-data-

      - name: Show build environment
        run: ./scripts/build.sh info

      - name: Build for testing
        run: ./scripts/build.sh build-for-testing

      - name: Upload the test build
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: build/DerivedData/Build/Products
          retention-days: 1

  unit-tests:
    name: Run unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the test build
        uses: actions/download-artifact@v8
        with:
          name: test-build
          path: build/DerivedData/Build/Products

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Run unit tests
        run: ./scripts/build.sh test-unit-without-building

      - name: Render the test summary
        if: always()
        run: python3 scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results (xcresult and log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            build/results/test-unit-*.xcresult
            build/logs/test-unit-*.log
          retention-days: 14
          if-no-files-found: warn

  ui-tests:
    # The UI suite is the pull request's critical path: it runs serially,
    # because parallel simulator clones crash (see scripts/build.sh), so its
    # wall time is the sum of every test's. Splitting it over two runners buys
    # the parallelism from separate machines instead, which is the part that
    # was never unstable.
    #
    # Shard 1 runs "everything the other shard is not taking", so a test the
    # split does not know about still runs rather than silently running
    # nowhere. Raising the shard count needs only this list changed.
    name: Run UI tests (${{ matrix.shard }} of 2)
    runs-on: macos-latest
    timeout-minutes: 25
    needs: build

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the test build
        uses: actions/download-artifact@v8
        with:
          name: test-build
          path: build/DerivedData/Build/Products

      - name: Select Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Run UI tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/2
        run: ./scripts/build.sh test-ui-without-building

      - name: Render the test summary
        if: always()
        run: python3 scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results (xcresult and log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: |
            build/results/test-ui-*.xcresult
            build/logs/test-ui-*.log
          retention-days: 14
          if-no-files-found: warn
