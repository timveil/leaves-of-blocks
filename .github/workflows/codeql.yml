name: CodeQL

on:
  # Push trigger removed deliberately. Every push to main lands via PR, and the
  # PR run already gates code into main, so a second run on the merge commit is
  # duplicative — paying ~13 min of macOS Swift trace overhead twice for the
  # same diff. The weekly cron keeps drift coverage if a query suite update
  # surfaces new findings against unchanged code.
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/metadata/**'
      - 'fastlane/screenshots/**'
  schedule:
    - cron: '21 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-latest
            build-mode: manual
          - language: ruby
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Build Swift directly (not via scripts/build.sh) so we can pin a single
      # architecture. The runner is arm64, so the x86_64 simulator slice is dead
      # weight — without ARCHS=arm64, xcodebuild compiles every Swift file twice
      # (once per arch), roughly doubling CodeQL's build time. COMPILER_INDEX_
      # STORE_ENABLE=NO skips the indexer; CodeQL doesn't use those artifacts.
      - name: Build Swift
        if: matrix.language == 'swift'
        run: |
          xcodebuild build \
            -project LeavesOfBlocks.xcodeproj \
            -scheme LeavesOfBlocks \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
