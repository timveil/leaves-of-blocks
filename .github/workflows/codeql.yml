name: Code Scanning

on:
  # Swift runs here, on the merge commit, and nowhere else in the PR path.
  #
  # The split is a cost/benefit one, measured rather than assumed: the traced
  # xcodebuild CodeQL needs takes ~18 min on a macOS runner and cannot be cached
  # (extraction wraps the compiler, so a warm cache silently analyzes less than
  # the whole codebase), while Swift analysis has produced zero findings in 30
  # runs. Every alert this repository has had came from Ruby and Actions, which
  # analyze from source on Ubuntu in under a minute and still run on every PR.
  #
  # So a pull request no longer waits ~22 min for a language that has never
  # found anything, main is still gated before anyone can build on the merge,
  # and the weekly schedule remains the backstop for query-suite drift. The
  # policy itself lives in scripts/codeql-languages.sh, with tests.
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/metadata/**'
      - 'fastlane/screenshots/**'
  #
  # paths-ignore decides only whether this workflow STARTS. Which languages
  # actually get analyzed is decided per-run by the `changes` job below —
  # without that, one changed Ruby file starts the workflow and the whole
  # matrix runs, including a full xcodebuild for Swift on a diff with no Swift.
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'fastlane/metadata/**'
      - 'fastlane/screenshots/**'
  schedule:
    - cron: '21 6 * * 1'

# A new push supersedes the previous run's answer, so letting the old one finish
# only holds a macOS runner that the new one then queues behind. Merges are not
# cancelled: main's analysis is what gates the branch, and losing it to a
# rapid second merge would leave a commit unanalyzed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the base commit is present for the diff below.
          fetch-depth: 0

      # On a pull_request event the checked-out ref is refs/pull/N/merge — the
      # head branch already merged into the current base tip. Diffing that
      # against base.sha therefore yields exactly the PR's own changes.
      #
      # Scheduled runs analyze everything: that run exists to catch drift
      # against unchanged code when a query suite updates, so narrowing it by
      # diff would defeat its purpose.
      - name: Detect affected languages
        id: detect
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
                | ./scripts/codeql-languages.sh --event pull_request >> "$GITHUB_OUTPUT"
              ;;
            push)
              # github.event.before is all-zeros for the first push to a branch,
              # and points at a rewritten commit after a force-push. Neither
              # yields a usable diff, so fall back to analyzing everything
              # rather than silently analyzing nothing.
              before="${{ github.event.before }}"
              if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
                git diff --name-only "$before" HEAD \
                  | ./scripts/codeql-languages.sh --event push >> "$GITHUB_OUTPUT"
              else
                ./scripts/codeql-languages.sh --event push --all >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              ./scripts/codeql-languages.sh --all >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Report language selection
        run: |
          set -euo pipefail
          {
            echo "### CodeQL language selection"
            echo
            echo "| Language | Analyzed |"
            echo "| --- | --- |"
            echo "| swift | ${{ steps.detect.outputs.swift }} |"
            echo "| ruby | ${{ steps.detect.outputs.ruby }} |"
            echo "| actions | ${{ steps.detect.outputs.actions }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze ${{ matrix.display }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Build Swift directly (not via scripts/build.sh) so we can pin a single
      # architecture. The runner is arm64, so the x86_64 simulator slice is dead
      # weight — without ARCHS=arm64, xcodebuild compiles every Swift file twice
      # (once per arch), roughly doubling CodeQL's build time. COMPILER_INDEX_
      # STORE_ENABLE=NO skips the indexer; CodeQL doesn't use those artifacts.
      - name: Select Xcode
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          DEVELOPER_DIR="$(./scripts/xcode-version.sh --select)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Build Swift for tracing
        if: matrix.language == 'swift'
        run: |
          xcodebuild build \
            -project LeavesOfBlocks.xcodeproj \
            -scheme LeavesOfBlocks \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
